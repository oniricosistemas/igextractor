name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            os: windows-latest
            pkg_target: node20-win-x64
            binary: igextractor.exe
          - platform: macos
            os: macos-latest
            pkg_target: node20-macos-x64
            binary: igextractor
          - platform: linux
            os: ubuntu-latest
            pkg_target: node20-linux-x64
            binary: igextractor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Puppeteer downloads Chromium for the current OS during npm install.
      # We locate it and copy it next to the binary later.
      - name: Find Chromium path
        id: chromium
        shell: bash
        run: |
          # Use puppeteer to find the exact executable path
          CHROME_EXE=$(node -e "
            try {
              const p = require('puppeteer');
              console.log(p.executablePath());
            } catch(e) { process.exit(1); }
          " 2>/dev/null || echo "")
          echo "exe=$CHROME_EXE" >> $GITHUB_OUTPUT
          echo "Chromium exe: $CHROME_EXE"

      - name: Install pkg
        run: npm install -g @yao-pkg/pkg

      - name: Compile binary
        run: pkg bin/igextractor.js --targets ${{ matrix.pkg_target }} --output dist/${{ matrix.binary }} --compress GZip
        shell: bash

      - name: Stage release folder (Unix)
        if: matrix.platform != 'win'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
          CHROME_EXE: ${{ steps.chromium.outputs.exe }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          STAGE="dist/igextractor-${VERSION}-${PLATFORM}-x64"
          mkdir -p "$STAGE"
          cp "dist/${BINARY}" "$STAGE/${BINARY}"
          chmod +x "$STAGE/${BINARY}"

          # Copy Chromium to exact path _findBundledChromium expects
          if [ -n "$CHROME_EXE" ] && [ -f "$CHROME_EXE" ]; then
            # Copy the entire parent folder — _findBundledChromium walks depth=5 to find the binary
            CHROME_PARENT="$(dirname "$CHROME_EXE")"
            mkdir -p "$STAGE/chromium"
            cp -r "$CHROME_PARENT/." "$STAGE/chromium/"
            chmod +x "$STAGE/chromium/chrome" 2>/dev/null || true
            chmod +x "$STAGE/chromium/Chromium" 2>/dev/null || true
            echo "Chromium staged from $CHROME_PARENT"
          else
            echo "WARNING: Chromium exe not found at '$CHROME_EXE'"
          fi

          printf 'IGExtractor v%s\n\nRun: ./%s  (you may need: chmod +x %s)\n\nThe chromium/ folder must stay next to the executable.\n\nGet Pro: https://cafecito.app/igextractor\nGitHub:  https://github.com/%s\n' \
            "$VERSION" "$BINARY" "$BINARY" "$REPO" > "$STAGE/README.txt"

          cd dist
          zip -r "igextractor-${VERSION}-${PLATFORM}-x64.zip" "igextractor-${VERSION}-${PLATFORM}-x64/"
          echo "ZIP_PATH=dist/igextractor-${VERSION}-${PLATFORM}-x64.zip" >> $GITHUB_ENV

      - name: Stage release folder (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          CHROME_EXE: ${{ steps.chromium.outputs.exe }}
          REPO: ${{ github.repository }}
        run: |
          $version    = $env:GITHUB_REF_NAME -replace '^v', ''
          $chromeExe  = $env:CHROME_EXE
          $stage      = "dist\igextractor-${version}-win-x64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "dist\igextractor.exe" "$stage\igextractor.exe"

          # Copy Chromium — _findBundledChromium walks depth=5 to find chrome.exe
          if ($chromeExe -and (Test-Path $chromeExe)) {
            $chromeParent = Split-Path $chromeExe -Parent
            $destDir = "$stage\chromium"
            New-Item -ItemType Directory -Path $destDir -Force | Out-Null
            Copy-Item -Recurse "$chromeParent\*" "$destDir\" -Force
            Write-Host "Chromium staged from $chromeParent"
          } else {
            Write-Warning "Chromium exe not found at '$chromeExe'"
          }

          "IGExtractor v${version}`n`nRun: igextractor.exe`n`nThe chromium\ folder must stay next to the executable.`n`nGet Pro: https://cafecito.app/igextractor`nGitHub:  https://github.com/$($env:REPO)" | Set-Content "$stage\README.txt"

          $zip = "dist\igextractor-${version}-win-x64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          echo "ZIP_PATH=$zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: igextractor-${{ matrix.platform }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: IGExtractor ${{ github.ref_name }}
          body: |
            ## IGExtractor ${{ github.ref_name }}

            ### Download

            | Platform | File |
            |----------|------|
            | Windows x64 | `igextractor-*-win-x64.zip` |
            | macOS x64   | `igextractor-*-macos-x64.zip` |
            | Linux x64   | `igextractor-*-linux-x64.zip` |

            ### Install

            1. Download the ZIP for your platform
            2. Extract it — keep the `chromium/` folder next to the executable
            3. Run `igextractor` (or `igextractor.exe` on Windows)

            ### Get Pro

            ☕ [cafecito.app/igextractor](https://cafecito.app/igextractor) — one-time payment, lifetime access.
          files: artifacts/**/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
